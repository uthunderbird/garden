name: Trigger garden-site rebuild

on:
  push:
    branches:
      - main

jobs:
  update-submodule:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout garden-site
        uses: actions/checkout@v4
        with:
          repository: uthunderbird/garden-site
          token: ${{ secrets.GARDEN_SITE_PAT }}
          submodules: true

      - name: Update content submodule to latest
        run: |
          git submodule update --remote content
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --staged --quiet || git commit -m "chore: update content submodule"
          git push
